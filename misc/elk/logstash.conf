input {
  gelf {
    port => 5044
  }
}

filter {
  # Le niveau numérique ajouté par GELF laisse la place à celui de l'application
  mutate { remove_field => ["level"] }
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  # Healthchecks Docker : ils fausseraient le volume
  if [client_ip] == "127.0.0.1" or [request][remote_ip] == "127.0.0.1" {
    drop {}
  }

  if [tag] == "front" {
    mutate {
      rename => {
        "msg" => "message"
        "status" => "http_status"
      }
      uppercase => ["level"]
    }
  }

  # Les logs d'accès sont écrits en INFO quel que soit le statut
  if [http_status] and [http_status] >= 500 {
    mutate { replace => { "level" => "ERROR" } }
  }

  mutate {
    rename => { "tag" => "service" }
    remove_field => ["client_ip", "request", "resp_headers", "ts"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microcrm-logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
