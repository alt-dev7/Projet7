name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build et tests
        working-directory: back
        run: ./gradlew build
      - name: Publier les résultats des tests
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: back/build/test-results/test/*.xml
          check_name: Tests back
          comment_mode: off
      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-back
          path: |
            back/build/test-results/test
            back/build/reports/tests
            back/build/reports/jacoco
            back/build/classes/java/main
          retention-days: 14

  front:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Build
        run: npx ng build --optimization
      - name: Tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
      - name: Chemins de couverture relatifs à la racine du dépôt
        run: sed -i 's|^SF:|SF:front/|' coverage/microcrm/lcov.info
      - name: Publier les résultats des tests
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: front/test-results/junit.xml
          check_name: Tests front
          comment_mode: off
      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-front
          path: |
            front/test-results
            front/coverage/microcrm
          retention-days: 14

  sonar:
    needs: [back, front]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rapports-back
          path: back/build
      - uses: actions/download-artifact@v4
        with:
          name: rapports-front
          path: front
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  compose:
    needs: [back, front]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer l'application
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Vérifier que l'application répond
        run: |
          curl -fsS http://localhost:8080/persons
          curl -fsS http://localhost/
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Arrêter l'application
        if: always()
        run: docker compose down

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Analyse des dépendances Gradle
        working-directory: back
        run: |
          ./gradlew bootJar
          docker run --rm -v "$PWD/build/libs:/jar:ro" aquasec/trivy:0.58.1 \
            rootfs --severity HIGH,CRITICAL --exit-code 0 /jar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Audit des dépendances npm
        working-directory: front
        run: npm ci && npm audit --audit-level=high
