name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - run: git checkout -B main
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: artefacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: front-dist
          path: artefacts/front
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Vérifier que le JAR démarre
        run: |
          java -jar artefacts/microcrm-0.0.1-SNAPSHOT.jar &
          for i in $(seq 1 24); do
            curl -fsS http://localhost:8080/persons && exit 0
            sleep 5
          done
          exit 1
      - name: Vérifier que le build Angular est servi
        run: |
          python3 -m http.server 4200 --directory artefacts/front &
          sleep 2
          curl -fsS http://localhost:4200/ | grep -q '<app-root'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Créer la release
        run: |
          npx --yes -p semantic-release@24 semantic-release \
            --branches main \
            --plugins @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github
      - name: Ajouter les artefacts à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git tag --points-at HEAD | grep '^v' | head -n 1)
          [ -n "$tag" ] || { echo "Aucune release pour ce commit"; exit 0; }
          version=${tag#v}
          mv artefacts/microcrm-0.0.1-SNAPSHOT.jar "microcrm-$version.jar"
          tar -czf "microcrm-front-$version.tar.gz" -C artefacts/front .
          gh release upload "$tag" "microcrm-$version.jar" "microcrm-front-$version.tar.gz"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ajouter le tag de version aux images
        run: |
          tag=$(git tag --points-at HEAD | grep '^v' | head -n 1)
          [ -n "$tag" ] || exit 0
          owner=${GITHUB_REPOSITORY_OWNER,,}
          sha=$(git rev-parse HEAD)
          for cible in back front; do
            image=ghcr.io/$owner/orion-microcrm-$cible
            for i in $(seq 1 60); do
              docker buildx imagetools inspect "$image:sha-$sha" >/dev/null 2>&1 && break
              sleep 10
            done
            docker buildx imagetools create -t "$image:${tag#v}" "$image:sha-$sha"
          done
